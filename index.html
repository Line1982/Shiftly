<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Shiftly</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="application-name" content="Shiftly">
  <meta name="apple-mobile-web-app-title" content="Shiftly">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f1f5f9">
  <meta name="format-detection" content="telephone=no">

  <!-- Manifest & Icons -->
  <link rel="manifest" href="manifest.json?v=4.5.5">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png?v=4.5.5">
  <link rel="icon" type="image/png" href="assets/icon-192.png?v=4.5.5">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=4.5.5">

  <link rel="stylesheet" href="styles.css?v=4.5.5">
</head>
<body>

  <div class="app-shell">

    <!-- SWIPEABLE TABS VIEWPORT -->
    <main class="tabs-viewport" id="tabsViewport">
      <div class="tabs-track" id="tabsTrack">

        <!-- ========================================================
             TAB 1: EINTRAGEN (HAUPTFOKUS — SEITE VOLL AUSGENUTZT)
             ======================================================== -->
        <section class="tab-screen" id="tab-entry" aria-label="Stunden eintragen">

          <!-- Top Key Metrics Strip (3 Numbers) -->
          <div class="status-strip">
            <div class="status-box status-box-week">
              <span class="status-label" id="statWeekLabel">Woche</span>
              <div class="status-value" id="statWeekHours">0 / 12 h</div>
              <div class="mini-progress">
                <div class="mini-progress-fill" id="statWeekBar" style="width: 0%;"></div>
              </div>
            </div>

            <div class="status-box">
              <span class="status-label">Monat</span>
              <div class="status-value" id="statMonthHours">0 h</div>
            </div>

            <div class="status-box">
              <span class="status-label">Überstunden</span>
              <div class="status-value" id="statOvertime">0 h</div>
            </div>
          </div>

          <!-- Central Direct Entry Card (Fills the screen harmoniously) -->
          <form class="entry-card" id="entryForm" novalidate>

            <!-- Edit Mode Banner (Only visible when editing an existing entry) -->
            <div class="edit-banner" id="editModeBanner" hidden>
              <span>✏️ Eintrag bearbeiten</span>
              <button type="button" class="btn-cancel-edit" id="btnCancelEdit">Abbrechen</button>
            </div>

            <!-- Row 1: Full-Width Type Switch + Spacious Date/Month Stepper -->
            <div class="entry-top-row">
              <div class="type-switch" role="radiogroup" aria-label="Eintragsart">
                <button type="button" class="type-pill active" data-type="work">⏱️ Arbeit</button>
                <button type="button" class="type-pill" data-type="vacation" title="Urlaubsplaner">🌴 Urlaub</button>
              </div>

              <div class="date-stepper" id="workDateStepper">
                <button type="button" class="date-step-btn" id="btnDatePrev" aria-label="Ein Tag zurück">‹</button>
                <div class="date-display-wrap" title="Datum wählen">
                  <span class="date-display-label" id="entryDateDisplay">Do., 05.11.</span>
                  <input type="date" class="date-input-overlay" id="entryDate" lang="de-DE">
                </div>
                <button type="button" class="date-step-btn" id="btnDateNext" aria-label="Ein Tag vor">›</button>
                <button type="button" class="date-today-btn" id="btnDateToday">Heute</button>
              </div>

              <!-- Vacation Calendar Month Stepper (Visible in Vacation Planner mode) -->
              <div class="date-stepper" id="vacMonthStepper" hidden>
                <button type="button" class="date-step-btn" id="btnVacCalPrev" aria-label="Vorheriger Monat">‹</button>
                <span class="vac-cal-month-label" id="vacCalMonthLabel">Monat</span>
                <button type="button" class="date-step-btn" id="btnVacCalNext" aria-label="Nächster Monat">›</button>
                <button type="button" class="date-today-btn" id="btnVacCalClear" title="Auswahl leeren">Reset</button>
              </div>
            </div>

            <!-- Row 2A: Work Shift Stacked Big 24h Time Cards + Clean Break Bar -->
            <div class="work-fields" id="modalWorkShiftFields">
              <div class="time-card-box">
                <span class="time-card-label">Beginn (24h)</span>
                <div class="time-24h-picker" role="group" aria-label="Schichtbeginn 24h">
                  <select class="time-24h-select" id="shiftStartHour" aria-label="Beginn Stunde"></select>
                  <span class="time-24h-colon">:</span>
                  <select class="time-24h-select" id="shiftStartMin" aria-label="Beginn Minute"></select>
                  <span class="time-24h-suffix">Uhr</span>
                </div>
                <input type="hidden" id="shiftStart" value="08:00">
              </div>

              <div class="time-card-box">
                <span class="time-card-label">Ende (24h)</span>
                <div class="time-24h-picker" role="group" aria-label="Schichtende 24h">
                  <select class="time-24h-select" id="shiftEndHour" aria-label="Ende Stunde"></select>
                  <span class="time-24h-colon">:</span>
                  <select class="time-24h-select" id="shiftEndMin" aria-label="Ende Minute"></select>
                  <span class="time-24h-suffix">Uhr</span>
                </div>
                <input type="hidden" id="shiftEnd" value="12:00">
              </div>

              <!-- Clean Unpaid Break Selector -->
              <div class="break-bar">
                <span class="break-label">Pause</span>
                <div class="break-pills">
                  <button type="button" class="break-pill active" data-break="0">Keine</button>
                  <button type="button" class="break-pill" data-break="15">15m</button>
                  <button type="button" class="break-pill" data-break="30">30m</button>
                  <button type="button" class="break-pill" data-break="45">45m</button>
                </div>
                <input type="hidden" id="shiftBreak" value="0">
              </div>
            </div>

            <!-- Row 2B: Interactive Vacation Range Calendar + Tactile Hours Card -->
            <div class="vacation-fields" id="modalVacationFields" hidden>
              <!-- Single-Day Edit Mode (Only visible when editing a single existing vacation record) -->
              <div id="vacSingleEditBox" class="vac-single-edit" hidden>
                <div class="time-card-box">
                  <span class="time-card-label">Urlaubsstunden</span>
                  <div class="target-setting-control">
                    <button type="button" class="target-step-btn" id="btnVacSingleMinus">−</button>
                    <input type="number" step="0.25" min="0" max="24" class="target-setting-input" id="vacationPaidHours" value="2.4">
                    <span class="target-setting-unit">h</span>
                    <button type="button" class="target-step-btn" id="btnVacSinglePlus">+</button>
                  </div>
                </div>
              </div>

              <!-- Interactive Month Calendar & Tactile Hours Editor Card -->
              <div id="vacPlannerBox" class="vac-planner-box">
                <!-- Quick Action Subbar above Calendar -->
                <div class="vac-cal-subbar">
                  <button type="button" class="vac-range-btn" id="btnVacSelectRange" title="Alle Werkstage zwischen erstem und letztem gewählten Tag markieren">↔ Zeitraum (Mo–Fr) füllen</button>
                  <span class="vac-remaining-badge" id="vacationRemainingHint">20 / 20 T. frei</span>
                </div>

                <!-- Compact 7-Column Calendar Grid -->
                <div class="vac-calendar-card">
                  <div class="vac-cal-weekdays">
                    <span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span class="wknd">Sa</span><span class="wknd">So</span>
                  </div>
                  <div class="vac-cal-grid" id="vacCalendarGrid"></div>
                </div>

                <!-- Compact Tactile Hours Editor Card (Side-by-Side Header + Stepper, Presets Row below) -->
                <div class="vac-hours-hero-card">
                  <div class="vac-hours-hero-top">
                    <div class="vac-hours-target-info">
                      <div class="vac-hours-eyebrow-row">
                        <span class="vac-hours-eyebrow" id="vacHoursEyebrow">Stunden pro Tag</span>
                        <button type="button" class="vac-apply-all-btn" id="btnVacApplyAll" hidden>Für alle</button>
                      </div>
                      <strong class="vac-hours-target-title" id="vacActiveDayLabel">Standard-Urlaubstag</strong>
                    </div>

                    <div class="vac-big-stepper">
                      <button type="button" class="vac-hero-step-btn" id="btnVacStdMinus" aria-label="Halbe Stunde weniger">−</button>
                      <div class="vac-hero-input-wrap">
                        <input type="number" step="0.25" min="0" max="24" id="vacDefaultHoursInput" class="vac-hero-input" value="2.4">
                        <span class="vac-hero-unit">h</span>
                      </div>
                      <button type="button" class="vac-hero-step-btn" id="btnVacStdPlus" aria-label="Halbe Stunde mehr">+</button>
                    </div>
                  </div>

                  <div class="vac-presets-group" id="vacQuickPresetGroup">
                    <button type="button" class="vac-preset-pill" data-vac-preset="auto" id="btnVacPresetAuto">2.4h</button>
                    <button type="button" class="vac-preset-pill" data-vac-preset="3">3h</button>
                    <button type="button" class="vac-preset-pill" data-vac-preset="4">4h</button>
                    <button type="button" class="vac-preset-pill" data-vac-preset="6">6h</button>
                    <button type="button" class="vac-preset-pill" data-vac-preset="8">8h</button>
                  </div>
                </div>
              </div>
            </div>

            <!-- Row 3: Optional Note (Only visible in Work Mode) -->
            <div class="note-row" id="entryNoteRow">
              <input type="text" class="note-input" id="entryNote" placeholder="Notiz (optional)…">
            </div>

            <!-- Row 4: Giant Submit Button with Live Net Hours -->
            <button type="submit" class="btn-save-giant" id="btnSubmitEntry">
              + 4 h eintragen
            </button>

          </form>

        </section>

        <!-- ========================================================
             TAB 2: VERLAUF (EINTRÄGE & WOCHEN)
             ======================================================== -->
        <section class="tab-screen" id="tab-shifts" aria-label="Verlauf">

          <!-- Month Stepper & Sub-View Toggle -->
          <div class="history-top-bar">
            <div class="month-stepper">
              <button type="button" class="month-step-btn" id="btnPrevPeriod" aria-label="Vorheriger Monat">‹</button>
              <button type="button" class="month-label-btn" id="btnActivePeriodLabel">
                <span id="activePeriodText">Monat</span>
              </button>
              <button type="button" class="month-step-btn" id="btnNextPeriod" aria-label="Nächster Monat">›</button>
            </div>

            <div class="view-switch">
              <button type="button" class="view-pill active" data-subview="list">Einträge</button>
              <button type="button" class="view-pill" data-subview="weeks">Wochen</button>
            </div>
          </div>

          <!-- Collapsible Custom Date Range Drawer -->
          <div class="custom-dates-drawer" id="customDatesDrawer" hidden>
            <div class="preset-row">
              <button type="button" class="period-pill active" data-preset="current_month">Monat</button>
              <button type="button" class="period-pill" data-preset="period_26_to_25">26.–25.</button>
              <button type="button" class="period-pill" data-preset="period_16_to_15">16.–15.</button>
              <button type="button" class="period-pill" data-preset="current_year">Jahr</button>
            </div>
            <div class="custom-dates-grid">
              <input type="date" class="date-input-compact" id="filterStartDate" aria-label="Von Datum">
              <span>–</span>
              <input type="date" class="date-input-compact" id="filterEndDate" aria-label="Bis Datum">
            </div>
          </div>

          <!-- Compact Period Summary Bar -->
          <div class="history-summary-bar">
            <span>Gesamt: <strong id="histTotalHours">0 h</strong></span>
            <span>Ziel: <strong id="histTargetInfo">12 h/Wo.</strong></span>
            <span>Urlaub: <strong id="histVacationInfo">20 T. frei</strong></span>
          </div>

          <!-- Scrollable List Container -->
          <div class="history-scroll-area">
            <div id="allShiftsList" class="records-list"></div>
            <div id="dashboardWeeklyBreakdown" class="weeks-list" hidden></div>
          </div>

        </section>

        <!-- ========================================================
             TAB 3: SETUP & EXPORT (KOMPAKT AUF 1 SEITE)
             ======================================================== -->
        <section class="tab-screen" id="tab-settings" aria-label="Einstellungen">

          <form class="settings-card" id="settingsForm">
            <div class="target-setting-hero">
              <label class="target-setting-label" for="settingWeeklyTarget">Zielstunden / Woche</label>
              <div class="target-setting-control">
                <button type="button" class="target-step-btn" id="btnTargetMinus">−</button>
                <input type="number" step="0.5" min="1" max="60" class="target-setting-input" id="settingWeeklyTarget" value="12" required>
                <span class="target-setting-unit">h</span>
                <button type="button" class="target-step-btn" id="btnTargetPlus">+</button>
              </div>
            </div>

            <div class="settings-grid-2">
              <div class="setting-box">
                <label class="setting-label" for="settingDefaultBreak">Standard-Pause (Min)</label>
                <input type="number" step="5" min="0" class="setting-input" id="settingDefaultBreak" value="0">
              </div>
              <div class="setting-box">
                <label class="setting-label" for="settingVacationDays">Urlaubstage / Jahr</label>
                <input type="number" min="0" class="setting-input" id="settingVacationDays" value="20" required>
              </div>
            </div>

            <div class="settings-grid-2">
              <div class="setting-box">
                <label class="setting-label" for="settingUserName">Name (für PDF)</label>
                <input type="text" class="setting-input" id="settingUserName" placeholder="Optional">
              </div>
              <div class="setting-box">
                <label class="setting-label" for="settingEmployerName">Firma (für PDF)</label>
                <input type="text" class="setting-input" id="settingEmployerName" placeholder="Optional">
              </div>
            </div>

            <button type="submit" class="btn-save-settings">✓ Einstellungen speichern</button>
          </form>

          <!-- Compact 2x2 Export & Backup Grid -->
          <div class="export-grid">
            <button type="button" class="export-btn" id="btnPrintTimesheet">
              <span class="export-btn-icon">🖨️</span>
              <span>PDF / Druck</span>
            </button>

            <button type="button" class="export-btn" id="btnExportCsv">
              <span class="export-btn-icon">📊</span>
              <span>CSV Export</span>
            </button>

            <button type="button" class="export-btn" id="btnBackupShare">
              <span class="export-btn-icon">☁️</span>
              <span>Backup</span>
            </button>

            <button type="button" class="export-btn" id="btnRestore">
              <span class="export-btn-icon">📥</span>
              <span>Einlesen</span>
            </button>
            <input type="file" id="fileRestoreInput" accept=".json" hidden>
          </div>

        </section>

      </div>
    </main>

    <!-- BOTTOM TAB NAVIGATION -->
    <nav class="bottom-nav" aria-label="Navigation">
      <button type="button" class="nav-tab active" data-tab="entry" data-index="0">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Eintragen</span>
      </button>

      <button type="button" class="nav-tab" data-tab="shifts" data-index="1">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"></line>
          <line x1="8" y1="12" x2="21" y2="12"></line>
          <line x1="8" y1="18" x2="21" y2="18"></line>
          <line x1="3" y1="6" x2="3.01" y2="6"></line>
          <line x1="3" y1="12" x2="3.01" y2="12"></line>
          <line x1="3" y1="18" x2="3.01" y2="18"></line>
        </svg>
        <span>Verlauf</span>
      </button>

      <button type="button" class="nav-tab" data-tab="settings" data-index="2">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
        <span>Setup</span>
      </button>
    </nav>

  </div>

  <!-- Toast Feedback Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Hidden Section for Official DIN A4 Printable Timesheet -->
  <section id="printTimesheetSection"></section>

  <!-- App Entry Script -->
  <script type="module" src="js/app.js?v=4.5.5"></script>
</body>
</html>
